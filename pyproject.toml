[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag"
version = "0.1.0"
description = "Asistente documental RAG (prueba técnica IC7): responde solo con documentos internos."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Juan Felipe Rojas" }]
dependencies = [
    "openai",
    "sentence-transformers",
    "chromadb",
    "pypdf",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "streamlit",
    "requests",
    "pydantic-settings",
    "python-dotenv",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "httpx",
    "fpdf2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = [
    "integration: requiere red, modelos descargados o servicios externos (sin costo salvo `llm`)",
    "llm: llama a Gemini (consume créditos); solo corre con RUN_LLM=1 y GEMINI_API_KEY",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["rag"]
# La UI se prueba con AppTest (ejecuta el script en otro contexto); se excluye del cálculo (M11-03)
omit = ["*/rag/ui_streamlit.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
